services:
  # ─────────────────────────────────────────
  # Servicio 1: API REST (FastAPI + MongoDB)
  # ─────────────────────────────────────────
  - type: web
    name: techgear-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn techgear_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: PYTHONIOENCODING
        value: utf-8

  # ─────────────────────────────────────────
  # Servicio 2: Frontend Web (Django)
  # ─────────────────────────────────────────
  - type: web
    name: techgear-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd techgear_web && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: PYTHONIOENCODING
        value: utf-8
